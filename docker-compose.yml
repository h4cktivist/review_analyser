services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2
    restart: unless-stopped
    env_file: .env
    environment:
      - discovery.type=single-node
      - DISABLE_INSTALL_DEMO_CONFIG=${DISABLE_INSTALL_DEMO_CONFIG}
      - DISABLE_SECURITY_PLUGIN=${DISABLE_SECURITY_PLUGIN}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 > /dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: review_analyser:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ANALYSIS_SERVICE_URL: http://analysis_service:8001
    volumes:
      - ./models:/app/models:ro
      - ./django_telegram_session.session:/app/django_telegram_session.session
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  analysis_service:
    build:
      context: .
      dockerfile: analysis_service/Dockerfile
    image: review_analysis_service:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  events_worker:
    build:
      context: .
      dockerfile: events_worker/Dockerfile
    image: review_events_worker:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MAIN_APP_API_URL: http://web:8000/api
    ports:
      - "8002:8002"
    depends_on:
      web:
        condition: service_started

  celery_worker:
    image: review_analyser:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ANALYSIS_SERVICE_URL: http://analysis_service:8001
    command: ["celery"]
    volumes:
      - ./models:/app/models:ro
      - ./django_telegram_session.session:/app/django_telegram_session.session
    depends_on:
      web:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      analysis_service:
        condition: service_healthy

volumes:
  postgres_data:
  opensearch_data:
